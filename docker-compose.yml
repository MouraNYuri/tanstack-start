services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pg_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      # Opcional: Apenas se precisar acessar o Postgres via DBeaver/TablePlus fora do servidor
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Aplicação TanStack Start
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanstack_app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://myuser:mysecretpassword@postgres:5432/mydatabase
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # 3. Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge